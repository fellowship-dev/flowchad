# Flowchad — project configuration
# Copy this file when installing flowchad into your project.

# Project name (used in reports and diagrams)
# name: my-app

# Base URL for flow execution
# url: https://staging.example.com

# Platform type: saas | website | mobile | internal
# See knowledge/platform-types.md for evaluation criteria per type.
# type: saas

# Widths captured at every step, in the same session (no reload between widths)
# viewports: [1440, 375]

# Default timing thresholds (seconds)
# timing:
#   slow: 3       # flag transitions slower than this
#   critical: 10  # flag as critical above this

# Credentials (env var references — never hardcode secrets)
# credentials:
#   email: $TEST_EMAIL
#   password: $TEST_PASSWORD

# Analytics integration (optional — enables metrics collection)
# analytics:
#   provider: posthog  # posthog | mixpanel | amplitude | segment
#   mcp: true          # connect via MCP server if available

# Evidence upload (optional — host screenshots/GIFs for issues/PRs)
# Evidence stays local unless you opt in. s3 uploads to the public evidence
# bucket (EVIDENCE_* env secret; see the evidence-upload skill): public by URL,
# and the uploader cannot delete. Screens must show test data only.
# evidence:
#   backend: none      # none (default) | s3

# Speckit integration (optional — cross-reference specs during walks)
# speckit:
#   path: .speckit/    # relative path to speckit directory
# Environments (optional — enables deployment-aware preflight)
# surface: what a walk may do there (knowledge/live-safety.md)
#   read-only-live     look only; unsafe requests are blocked (default for non-localhost)
#   write-allowed-test may create test data, submit forms, receive captured mail
#   local-copy         built locally from a named commit with test keys (default for localhost)
# environments:
#   dev:
#     url: http://localhost:3000
#     surface: local-copy
#   staging:
#     url: https://staging.example.com
#     surface: write-allowed-test
#     deploy_check: gh-actions   # gh-actions | vercel | none
#     deploy_timeout: 300        # seconds to wait for deploy (default: 300)
#   production:
#     url: https://example.com
#     surface: read-only-live
#     deploy_check: vercel
#     deploy_timeout: 120

# Locales (auto-detected by /flowchad-setup — do not edit manually)
# Run /flowchad-setup to refresh after i18n config changes.
# [en] = English-only site, no locale-prefixed paths.
# [en, es] = generates /es/* paths for flows when walking locale-aware routes.
# locales: [en]

# Navvi persona for authenticated flows (optional)
# Enables: real form submissions, email verification, sign-up flows
# persona: flowchad-my-project  # gopass entry at navvi/flowchad-my-project/{email,password}

# Smoke test configuration (schedule lives in crew.yml, not here)
# smoke:
#   flows: [page-load, contact-form]      # flows to run during smoke tests
#   skip_production: [contact-form]       # skip these flows in production unless persona available
